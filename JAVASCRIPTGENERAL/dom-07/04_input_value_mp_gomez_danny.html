<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de capacitacion | Recursos Humanos</title>
    <script src="04_input_value_mp_gomez_danny.js" defer></script>
</head>
<body>
    <h1>Calcular horas de capacitacion</h1>
    <label for="sesiones">Cantidad de sesiones:</label>
    <input id="sesiones" type="number" min="0" placeholder="Numero de sesiones">
    <label for="horas">Horas por sesion:</label>
    <input id="horas" type="number" min="0" placeholder="Horas por sesion">
    <button id="calcular">Calcular</button>
    <h2 id="resultado">Total de horas: </h2>
</body>
</html>
