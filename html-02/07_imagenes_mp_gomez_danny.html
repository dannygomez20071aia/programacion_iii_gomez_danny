<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imágenes de Recursos Humanos</title>
</head>
<body>
    <h1>Uso de la etiqueta IMG en Recursos Humanos</h1>
    <img src="/imagenes/rec_h.avif"
         alt="Equipo de trabajo colaborando en una reunión"
         width="600"
         loading="lazy">
    <figure>
        <h2>Trabajo en equipo</h2>
        <img src="/imagenes/recursos_h.avif"
             alt="Personas participando en una reunión de trabajo"
             width="600"
             loading="lazy">
        <figcaption>La colaboración y la comunicación ayudan a crear un buen ambiente laboral.</figcaption>
    </figure>
    <a href="https://www.trabajo.gob.ec/" target="_blank" rel="noopener noreferrer">
        Consultar información del Ministerio del Trabajo del Ecuador
        <img src="/imagenes/ministerio_trabajo.webp"
             alt="Equipo de una organización"
             width="300"
             loading="lazy">
    </a>
</body>
</html>
