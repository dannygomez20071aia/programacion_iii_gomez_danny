<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/registro" method="post">
        <table>
            <tr> 
                <td>
                    <label for="nombre">Nombre:</label><br>
                    <input type="text" id="nombre" name="nombre" 
                    placeholder="Ej. Luke " 
                    minlength="3" 
                    maxlength="40" 
                    required>
                </td>
                <td>
                    <label for="apellido">Apellido:</label><br>
                    <input type="text" id="apellido" name="apellido" 
                    placeholder="Ej. Skywalker" 
                    minlength="3" 
                    maxlength="40" 
                    required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="password">Contraseña:</label><br>
                    <input type="password" id="password" name="password" >
                </td>
                <td>
                    <label for="password_confirm">Confirmar Contraseña:</label><br>
                    <input type="password" id="password_confirm" name="password_confirm" >
                </td>
            </tr>
            <tr>
                <td>
                    <label for="edad">Edad:</label><br>
                    <input type="number" id="edad" name="edad" >
                </td>
                <td>
                    <label for="nivel">Nivel:</label><br>
                    <input type="number" id="nivel" name="nivel" 
                    min="10"
                    max="100"
                    value="50"
                    step="5">
                </td>
            </tr>
            <tr>
                <td>
                    <p>Seleccione su bando:</p>
                    <input type="radio" id="jedi" name="bando" value="jedi" >
                    <label for="jedi">Jedi</label>
                    <input type="radio" id="sith" name="bando" value="sith" >
                    <label for="sith">Sith</label>
                </td>
                <td>
                    <p>Seleccione tus habilidades:</p><br>
                    <input type="checkbox" 
                        id="fuerza" 
                        name="habilidades" 
                        value="fuerza" 
                        >
                    <label for="fuerza">Uso de la Fuerza</label><br>
                    <input
                    type="checkbox"
                    id =" sable"
                    name="habilidades"
                    value ="sable">
                    <label for ="sable">Uso de la Sable de Luz</label><br>
                    <input
                    type="checkbox"
                    id="sable"
                    name="habilidades"
                    value="Levitar"
                    >
                    <label for="Levitar">Levitar Objetos</label><br>
                </td>
            </tr>
            </tr>
            <tr>
                <td>
                    <label for="planeta">Planeta de Origen:</label><br>
                    <select id="planeta" name="planeta" required>
                        <option value="">
                            Selecciona un Planeta
                        </option>
                        <option value="Tatooine">Tatooine</option>
                        <option value="Alderaan">Alderaan</option>
                        <option value="Naboo">Naboo</option>
                        <option value="Coruscant">Coruscant</option>
                    </select>
                </td>
                <td>
                    <label for="edad">Droide:</label><br>
                    <select id="droide" name="droide" multiple size="2" >
                        <option value="" selected>
                            Selecciona un Droide
                        </option>
                        <option value="C3PO">C-3PO</option>
                        <option value="R2D2">R2-D2</option>
                        <option value="BB8">BB-8</option>
                    </select>
                </td>
                <TR>
                    <td>
                        <fieldset>
                            <legend>Datos Generales</legend>
                            <label for ="misiones">Misiones:</label><br>
                            <input type="text" id="misiones" name="misiones">
                            <br>
                            <label for="vuelos">Vuelos:</label><br>
                            <input type="number" id="vuelos" name="vuelos">
                        </fieldset>
                    </td>
                </TR>
            </tr>
        </table>
        <button type="submit">Enviar</button>
        <button type="reset">Borrar</button>
    </form>
</body>
</html>
