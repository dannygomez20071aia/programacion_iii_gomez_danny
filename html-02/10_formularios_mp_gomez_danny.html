<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Recursos Humanos</title>
</head>
<body>
    <h1>Registro de perfil profesional</h1>
    <form action="#" method="get">
        <table>
            <tr>
                <td>
                    <label for="nombre">Nombre:</label><br>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Dannylucho" minlength="2" maxlength="40" required>
                </td>
                <td>
                    <label for="apellido">Apellido:</label><br>
                    <input type="text" id="apellido" name="apellido" placeholder="Ej. Curiosito" minlength="2" maxlength="40" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="correo">Correo electrónico:</label><br>
                    <input type="email" id="correo" name="correo" placeholder="ana@ejemplo.com" required>
                </td>
                <td>
                    <label for="telefono">Teléfono:</label><br>
                    <input type="tel" id="telefono" name="telefono" placeholder="0991234567">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="edad">Edad:</label><br>
                    <input type="number" id="edad" name="edad" min="18" max="100">
                </td>
                <td>
                    <label for="experiencia">Años de experiencia:</label><br>
                    <input type="number" id="experiencia" name="experiencia" min="0" max="50" value="0">
                </td>
            </tr>
            <tr>
                <td>
                    <p>Modalidad de trabajo:</p>
                    <input type="radio" id="presencial" name="modalidad" value="presencial" required>
                    <label for="presencial">Presencial</label>
                    <input type="radio" id="hibrida" name="modalidad" value="hibrida">
                    <label for="hibrida">Híbrida</label>
                    <input type="radio" id="remota" name="modalidad" value="remota">
                    <label for="remota">Remota</label>
                </td>
                <td>
                    <p>Habilidades:</p>
                    <input type="checkbox" id="comunicacion" name="habilidades" value="comunicacion">
                    <label for="comunicacion">Comunicación</label><br>
                    <input type="checkbox" id="organizacion" name="habilidades" value="organizacion">
                    <label for="organizacion">Organización</label><br>
                    <input type="checkbox" id="trabajo-equipo" name="habilidades" value="trabajo-equipo">
                    <label for="trabajo-equipo">Trabajo en equipo</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="area">Área de interés:</label><br>
                    <select id="area" name="area" required>
                        <option value="">Selecciona un área</option>
                        <option value="seleccion">Selección de personal</option>
                        <option value="capacitacion">Capacitación</option>
                        <option value="nomina">Nómina</option>
                        <option value="bienestar">Bienestar laboral</option>
                    </select>
                </td>
                <td>
                    <label for="herramientas">Herramientas que conoce:</label><br>
                    <select id="herramientas" name="herramientas" multiple size="3">
                        <option value="hojas-calculo">Hojas de cálculo</option>
                        <option value="videollamadas">Videollamadas</option>
                        <option value="gestion-personal">Sistemas de gestión de personal</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <fieldset>
                        <legend>Disponibilidad</legend>
                        <label for="fecha-inicio">Fecha posible de inicio:</label><br>
                        <input type="date" id="fecha-inicio" name="fecha-inicio">
                    </fieldset>
                </td>
            </tr>
        </table>
        <button type="submit">Enviar perfil</button>
        <button type="reset">Borrar datos</button>
    </form>
</body>
</html>
