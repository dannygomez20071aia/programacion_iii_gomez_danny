<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello CSS</title>
    <style>
        h1 {
            color:blueviolet;
        }
        p {
            color:green;    
        }
    </style>
    <link rel="stylesheet" href="01_hello_css.css">
</head>
<body>
       <h1>Maneras de incluir Estilos CSS en archivo html</h1>
       <h1 style="color:blue;">Hello World con CSS - Tipo Inline</h1> 
       <h2>estilo CSS - Interno</h2> 
       <p>Esto es un párrafo con estilo CSS - Interno, Colocando los estilos en el head del Html</p>
       <h3>estilo CSS - Externo</h3>
       <a>Se inlcuyo estilo a traves de un archivo externo</a>
</body>
</html>
